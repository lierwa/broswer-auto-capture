            <li><button class="action-row" type="button" data-action="click-repo"><span class="action-icon">↗</span><span class="action-title">点击选中的仓库</span><span class="action-time">5.121s</span><i class="ok-dot"></i></button></li>

        <article class="stage-node" data-stage="5" data-x="1316">

            <span class="stage-copy"><small>阶段</small><strong>进入 Issues</strong></span>

          </button>
          <ol class="action-list">
            <li><button class="action-row" type="button" data-action="read-tabs"><span class="action-icon">◉</span><span class="action-title">读取仓库导航</span><span class="action-time">0.426s</span><i class="ok-dot"></i></button></li>
            <li><button class="action-row" type="button" data-action="select-issues"><span class="action-icon">◆</span><span class="action-title">选择 Issues</span><span class="action-time">0.114s</span><i class="ok-dot"></i></button></li>
            <li><button class="action-row" type="button" data-action="click-issues"><span class="action-icon">↗</span><span class="action-title">点击 Issues</span><span class="action-time">7.517s</span><i class="ok-dot"></i></button></li>
          </ol>
        </article>

        <article class="stage-node" data-stage="6" data-x="1626">
          <button class="stage-head" type="button" data-stage-detail="6">
            <span class="stage-number">06</span>
            <span class="stage-copy"><small>阶段</small><strong>进入第二页</strong></span>

          <ol class="action-list">

        <article class="stage-node" data-stage="7" data-x="1936">
          <button class="stage-head" type="button" data-stage-detail="7">

            <span class="stage-copy"><small>阶段</small><strong>打开首个 Issue</strong></span>

          <ol class="action-list">

          <ol class="action-list">

            <li><button class="action-row" type="button" data-action="bind-fields"><span class="action-icon">⇆</span><span class="action-title">绑定输出字段</span><span class="action-time">0.003s</span><i class="ok-dot"></i></button></li>
            <li><button class="action-row" type="button" data-action="assemble-output"><span class="action-icon">✓</span><span class="action-title">生成最终结果</span><span class="action-time">0.002s</span><i class="ok-dot"></i></button></li>
          </ol>

        <article class="terminal-node" data-terminal="end" data-stage="completed" data-x="2556">
          <button class="terminal-button" type="button" data-open-output>
            <span class="terminal-mark">✓</span>

      <div class="zoom-controls" role="group" aria-label="画布缩放">
        <button type="button" data-zoom-out aria-label="缩小">−</button>
        <output data-zoom-label>92%</output>
        <button type="button" data-zoom-in aria-label="放大">＋</button>
        <button type="button" data-fit aria-label="适应画布">⌗</button>

      <div class="minimap" aria-label="链路缩略图" role="button" tabindex="0">
        <div class="mini-track"></div>
        <div class="mini-view"></div>

    <aside class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div><small data-drawer-kicker>动作</small><h2 data-drawer-title>选择目标仓库</h2></div>
        <button class="drawer-close" type="button" aria-label="关闭详情">×</button>
      </div>
      <div class="drawer-body" data-drawer-body></div>
    </aside>
  </section>

  <script>
    (() => {
      const root = document.querySelector('#bat-chain-stage-list-node');
      if (!root) return;
      const viewport = root.querySelector('.viewport');
      const world = root.querySelector('.world');
      const svg = root.querySelector('.edges');
      const drawer = root.querySelector('.drawer');
      const drawerKicker = root.querySelector('[data-drawer-kicker]');
      const drawerTitle = root.querySelector('[data-drawer-title]');
      const drawerBody = root.querySelector('[data-drawer-body]');
      const zoomLabel = root.querySelector('[data-zoom-label]');
      const miniTrack = root.querySelector('.mini-track');
      const miniView = root.querySelector('.mini-view');
      const stageNodes = [...root.querySelectorAll('.stage-node')];
      const startTerminal = root.querySelector('.terminal-node[data-terminal="start"]');
      const endTerminal = root.querySelector('.terminal-node[data-terminal="end"]');
      const allNodes = [startTerminal, ...stageNodes, endTerminal];
      const worldWidth = 3040;
      const worldHeight = 640;
      const centerLine = 270;
      let scale = .92;
      let tx = -770;
      let ty = -36;
      let drag = null;

      const actionFacts = {
        'open-github': ['打开 github.com', '浏览器打开页面', 'https://github.com', 'GitHub 首页已加载', '8.710 秒', 's-a-0001'],
        'focus-search': ['点击搜索框', '浏览器点击', 'Search or jump to…', '搜索输入框获得焦点', '2.349 秒', 's-a-0002'],
        'type-query': ['输入 langchain-ai/langgraph', '浏览器输入', 'GitHub 搜索框', '查询文本已写入', '1.743 秒', 's-a-0003'],
        'submit-query': ['提交搜索', '键盘操作', '当前搜索框', '搜索结果页已打开', '2.136 秒', 's-a-0004'],
        'read-repos': ['读取搜索候选', '页面读取', '搜索结果中的仓库候选', '读到可供选择的候选列表', '1.054 秒', 's-a-0005'],
        'select-repo': ['选择目标仓库', '确定性选择', '搜索结果中的仓库候选', '选中 /langchain-ai/langgraph', '0.211 秒', 'selection-a-0006'],
        'click-repo': ['点击选中的仓库', '浏览器点击', '已选中的仓库链接', '目标仓库页面已打开', '5.121 秒', 's-a-0006'],
        'read-tabs': ['读取仓库导航', '页面读取', '仓库页导航栏', '读到 Issues 入口', '0.426 秒', 's-a-0008'],
        'select-issues': ['选择 Issues', '确定性选择', '仓库导航候选', '选中 Issues 入口', '0.114 秒', 'selection-a-0009'],
        'click-issues': ['点击 Issues', '浏览器点击', '已选中的 Issues 入口', 'Issue 列表页已打开', '7.517 秒', 's-a-0009'],
        'read-next': ['读取 next', '页面读取', 'Issue 列表分页区', '读到下一页入口', '0.473 秒', 's-a-0011'],
        'open-page2': ['打开第二页', '浏览器点击', 'next 分页入口', 'Issue 第二页已打开', '5.384 秒', 's-a-0012'],
        'read-issues': ['读取 Issues', '页面读取', '第二页 Issue 列表', '读到当前页 Issue 候选', '1.122 秒', 's-a-0015'],
        'select-first': ['选择首页第一项', '确定性选择', '第二页 Issue 候选', '选中当前页第一条 Issue', '0.134 秒', 'selection-a-0016'],
        'open-issue': ['打开 Issue', '浏览器点击', '已选中的 Issue 链接', 'Issue 详情页已打开', '3.328 秒', 's-a-0016'],
        'read-fields': ['读取标题与正文', '页面读取', '当前 Issue 详情页', '读到标题与正文', '1.475 秒', 's-a-0022'],
        'bind-fields': ['绑定输出字段', '值绑定', '标题与正文读取结果', '标题、正文已绑定到输出', '0.003 秒', 'output-values'],
        'assemble-output': ['生成最终结果', '结果组装', '已绑定的标题与正文', '生成一条结构化记录', '0.002 秒', 'output-assemble']
      };

      const stageFacts = {
        1: ['打开 GitHub', '1 个动作', '无', 'GitHub 首页', '8.710 秒'],
        2: ['打开搜索入口', '1 个动作', 'GitHub 首页', '已聚焦搜索框', '2.349 秒'],
        3: ['搜索目标仓库', '2 个动作', '已聚焦搜索框', '仓库搜索结果', '3.879 秒'],
        4: ['进入目标仓库', '3 个动作', '仓库搜索结果', 'langchain-ai/langgraph 仓库页', '6.386 秒'],
        5: ['进入 Issues', '3 个动作', '目标仓库页', 'Issue 列表第一页', '8.057 秒'],
        6: ['进入第二页', '2 个动作', 'Issue 列表第一页', 'Issue 列表第二页', '5.857 秒'],
        7: ['打开首个 Issue', '3 个动作', 'Issue 列表第二页', '首个 Issue 详情页', '4.584 秒'],
        8: ['读取并组织输出', '3 个动作', 'Issue 详情页', '单条记录', '1.480 秒']
      };

      function positionNodes() {
        allNodes.forEach((node) => {
          node.style.left = `${Number(node.dataset.x)}px`;
          const header = node.querySelector('.stage-head');
          const anchorHeight = header ? header.offsetHeight : node.offsetHeight;
          node.style.top = `${centerLine - anchorHeight / 2}px`;
        });
        drawEdges();
        buildMinimap();
      }

      function portY(node) {
        const header = node.querySelector('.stage-head');
        return node.offsetTop + (header ? header.offsetHeight / 2 : node.offsetHeight / 2);
      }

      function drawEdges() {
        svg.querySelectorAll('.edge').forEach((edge) => edge.remove());
        allNodes.forEach((node, index) => {
          const next = allNodes[index + 1];
          if (!next) return;
          const x1 = node.offsetLeft + node.offsetWidth + 5;
          const y1 = portY(node);
          const x2 = next.offsetLeft - 6;
          const y2 = portY(next);
          const bend = Math.max(34, (x2 - x1) * .48);
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`);
          path.setAttribute('marker-end', 'url(#bat-stage-arrow)');
          path.setAttribute('class', `edge ${node.classList.contains('is-selected') || next.classList.contains('is-selected') ? 'is-active' : ''}`);
          path.dataset.from = node.dataset.stage;
          path.dataset.to = next.dataset.stage;
          svg.appendChild(path);
        });
      }

      function applyTransform() {
        world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        zoomLabel.textContent = `${Math.round(scale * 100)}%`;
        updateMinimap();
      }

      function focusStage(id) {
        const node = root.querySelector(`[data-stage="${id}"]`);
        if (!node) return;
        const visibleWidth = viewport.clientWidth;
        const visibleHeight = viewport.clientHeight;
        scale = .92;
        tx = visibleWidth / 2 - (node.offsetLeft + node.offsetWidth / 2) * scale;
        ty = visibleHeight / 2 - centerLine * scale;
        applyTransform();
      }

      function fitAll() {
        const first = allNodes[0];
        const last = allNodes[allNodes.length - 1];
        const contentWidth = last.offsetLeft + last.offsetWidth - first.offsetLeft + 80;
        scale = Math.max(.28, Math.min(.7, viewport.clientWidth / contentWidth));
        tx = 24 - first.offsetLeft * scale;
        ty = viewport.clientHeight / 2 - centerLine * scale;
        applyTransform();
      }

      function selectStage(id) {
        stageNodes.forEach((node) => node.classList.toggle('is-selected', node.dataset.stage === String(id)));
        root.querySelectorAll('.action-row').forEach((row) => row.classList.remove('is-selected'));
        drawEdges();
      }

      function openDrawer(kicker, title, body) {
        drawerKicker.textContent = kicker;
        drawerTitle.textContent = title;
        drawerBody.innerHTML = body;
        drawer.classList.add('is-open');
        drawer.setAttribute('aria-hidden', 'false');
      }

      function actionBody(facts) {
        return `<div class="status-line"><i></i>本次运行已完成</div>
          <dl class="fact-list">
            <div><dt>做了什么</dt><dd>${facts[1]}</dd></div>
            <div><dt>作用目标</dt><dd>${facts[2]}</dd></div>
            <div><dt>完成条件</dt><dd>${facts[3]}</dd></div>
            <div><dt>实际出口</dt><dd>success</dd></div>
            <div><dt>本次节点输出</dt><dd>未记录</dd></div>
            <div><dt>耗时</dt><dd>${facts[4]}</dd></div>
          </dl>
          <details><summary>高级信息</summary><div class="advanced">节点 ${facts[5]}<br>状态 completed</div></details>`;
      }

      function stageBody(facts) {
        return `<div class="status-line"><i></i>阶段已完成</div>
          <dl class="fact-list">
            <div><dt>包含动作</dt><dd>${facts[1]}</dd></div>
            <div><dt>入口上下文</dt><dd>${facts[2]}</dd></div>
            <div><dt>出口上下文</dt><dd>${facts[3]}</dd></div>
            <div><dt>总耗时</dt><dd>${facts[4]}</dd></div>
          </dl>`;
      }

      const currentOutputBody = `<div class="result-card"><small>标题</small><h3>Boundary insert: add input to a running run at its next step boundary without cancelling it #9046</h3><small>正文</small><p>正文共 3,086 字符。此处显示可阅读预览；展开后查看完整正文。</p><div class="result-actions"><button class="button primary" type="button">展开全文</button><button class="button" type="button">复制结果</button></div></div>`;

      function openOutput() {
        root.querySelectorAll('.stage-node').forEach((node) => node.classList.remove('is-selected'));
        root.querySelectorAll('.action-row').forEach((row) => row.classList.remove('is-selected'));
        drawEdges();
        openDrawer('本次结果', '单条记录', currentOutputBody);
      }

      root.addEventListener('click', (event) => {
        const action = event.target.closest('[data-action]');
        if (action) {
          const facts = actionFacts[action.dataset.action];
          const owner = action.closest('.stage-node');
          selectStage(owner.dataset.stage);
          root.querySelectorAll('.action-row').forEach((row) => row.classList.toggle('is-selected', row === action));
          openDrawer('动作', facts[0], actionBody(facts));
          return;
        }

        const stage = event.target.closest('[data-stage-detail]');
        if (stage) {
          const id = stage.dataset.stageDetail;
          const facts = stageFacts[id];
          selectStage(id);
          openDrawer(`阶段 ${String(id).padStart(2, '0')}`, facts[0], stageBody(facts));
          return;
        }

        if (event.target.closest('[data-open-output]')) { openOutput(); return; }
        if (event.target.closest('.drawer-close')) {
          drawer.classList.remove('is-open');
          drawer.setAttribute('aria-hidden', 'true');
          return;
        }
        const focus = event.target.closest('[data-focus]');
        if (focus) { focusStage(focus.dataset.focus); return; }
        if (event.target.closest('[data-fit]')) { fitAll(); return; }
        if (event.target.closest('[data-zoom-in]')) {
          scale = Math.min(1.35, scale + .1); applyTransform(); return;
        }
        if (event.target.closest('[data-zoom-out]')) {
          scale = Math.max(.32, scale - .1); applyTransform();
        }
      });

      viewport.addEventListener('pointerdown', (event) => {
        if (event.target.closest('button, .minimap')) return;
        drag = { x: event.clientX, y: event.clientY, tx, ty };
        viewport.setPointerCapture(event.pointerId);
        viewport.classList.add('is-panning');
      });

      viewport.addEventListener('pointermove', (event) => {
        if (!drag) return;
        tx = drag.tx + event.clientX - drag.x;
        ty = drag.ty + event.clientY - drag.y;
        applyTransform();
      });

      viewport.addEventListener('pointerup', () => { drag = null; viewport.classList.remove('is-panning'); });
      viewport.addEventListener('pointercancel', () => { drag = null; viewport.classList.remove('is-panning'); });
      viewport.addEventListener('wheel', (event) => {
        event.preventDefault();
        if (event.ctrlKey || event.metaKey) {
          const rect = viewport.getBoundingClientRect();
          const px = event.clientX - rect.left;
          const py = event.clientY - rect.top;
          const wx = (px - tx) / scale;
          const wy = (py - ty) / scale;
          const next = Math.max(.32, Math.min(1.35, scale * (event.deltaY > 0 ? .9 : 1.1)));
          tx = px - wx * next;
          ty = py - wy * next;
          scale = next;
        } else {
          tx -= event.deltaX || event.deltaY;
          ty -= event.deltaX ? event.deltaY : 0;
        }
        applyTransform();
      }, { passive: false });

      function buildMinimap() {
        miniTrack.innerHTML = '';
        allNodes.forEach((node) => {
          const mini = document.createElement('span');
          mini.className = `mini-node ${node === startTerminal || node === endTerminal ? 'terminal' : ''}`;
          mini.style.left = `${7 + node.offsetLeft / worldWidth * 158}px`;
          miniTrack.appendChild(mini);
        });
        updateMinimap();
      }

      function updateMinimap() {
        const miniWidth = root.querySelector('.minimap').clientWidth;
        const ratio = (miniWidth - 14) / worldWidth;
        const visibleWorld = viewport.clientWidth / scale;
        const worldLeft = -tx / scale;
        miniView.style.left = `${7 + Math.max(0, worldLeft) * ratio}px`;
        miniView.style.width = `${Math.max(18, Math.min(miniWidth - 14, visibleWorld * ratio))}px`;
      }

      root.querySelector('.minimap').addEventListener('click', (event) => {
        const rect = event.currentTarget.getBoundingClientRect();
        const ratio = worldWidth / (rect.width - 14);
        const worldX = Math.max(0, event.clientX - rect.left - 7) * ratio;
        tx = viewport.clientWidth / 2 - worldX * scale;
        applyTransform();
      });

      requestAnimationFrame(() => {
        positionNodes();
        focusStage(4);
      });
      window.addEventListener('resize', () => { positionNodes(); applyTransform(); });
    })();
  </script>
</div>
